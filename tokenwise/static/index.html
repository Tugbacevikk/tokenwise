<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tokenwise</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%227%22 fill=%22%23c15f3c%22/%3E%3C/svg%3E">
<style>
  [hidden] { display: none !important; }
  :root {
    --bg: #faf9f6; --panel: #f0eee8; --card: #ffffff; --line: #dcd8cf;
    --text: #22201c; --muted: #7a766c; --accent: #c15f3c; --accent-soft: #f7e6de;
    --add: #e6f4ea; --add-text: #1d6b34; --del: #fbe9e7; --del-text: #9b2c1f;
    --ok: #1d6b34; --warn: #8a5a00; --err: #9b2c1f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text); display: grid; grid-template-columns: 280px 1fr;
  }
  aside {
    background: var(--panel); border-right: 1px solid var(--line); padding: 16px;
    overflow: auto; display: flex; flex-direction: column; gap: 14px;
  }
  aside h1 { font-size: 17px; margin: 0; }
  aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 4px; }
  select, input[type=text] {
    font: inherit; font-size: 14px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line);
    background: #fff; color: var(--text); width: 100%;
  }
  .files { font: 12px/1.6 ui-monospace, Consolas, monospace; color: var(--muted); white-space: pre-line; word-break: break-all; max-height: 180px; overflow: auto; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--accent); width: 0; }
  .plan-link { display: block; width: 100%; text-align: left; margin-bottom: 4px; }
  main { display: flex; flex-direction: column; min-width: 0; }
  #log { flex: 1; overflow: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
  .msg { max-width: 880px; width: 100%; margin: 0 auto; }
  .user { background: var(--accent-soft); border-radius: 14px; padding: 10px 14px; align-self: flex-end; max-width: 70%; white-space: pre-wrap; }
  .assistant { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
  .muted { color: var(--muted); font-size: 13px; }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .err { color: var(--err); }
  .file { font: 13px ui-monospace, Consolas, monospace; margin-top: 10px; font-weight: 600; }
  pre.diff, .sbs {
    margin: 4px 0 0; padding: 8px 0; background: #fbfaf7; border: 1px solid var(--line);
    border-radius: 8px; overflow: auto; font: 12.5px/1.5 ui-monospace, Consolas, monospace;
  }
  pre.diff div { padding: 0 12px; white-space: pre; }
  pre.diff .add, .cell.add { background: var(--add); color: var(--add-text); }
  pre.diff .del, .cell.del { background: var(--del); color: var(--del-text); }
  pre.diff .hunk { color: var(--muted); }
  .sbs { display: grid; grid-template-columns: 1fr 1fr; }
  .cell { white-space: pre; padding: 0 10px; overflow: hidden; min-height: 1.5em; }
  .cell.empty { background: #f3f1ec; }
  details { margin-top: 6px; }
  details pre { white-space: pre-wrap; background: #fbfaf7; border: 1px solid var(--line); border-radius: 8px; padding: 8px; font: 12px/1.5 ui-monospace, Consolas, monospace; max-height: 260px; overflow: auto; }
  .plan { border: 1px solid var(--accent); border-radius: 14px; padding: 14px; background: #fffdfb; }
  .plan-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .plan-head h3 { margin: 0; font-size: 16px; flex: 1; }
  .thread { border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-top: 10px; background: #fff; }
  .thread.done { opacity: .6; }
  .thread.skipped { opacity: .45; }
  .thread-head { display: flex; gap: 8px; align-items: center; }
  .num { background: var(--accent-soft); color: var(--accent); border-radius: 50%; width: 22px; height: 22px; display: inline-grid; place-items: center; font-size: 12px; font-weight: 600; }
  .badge { margin-left: auto; font-size: 11px; padding: 2px 8px; border-radius: 10px; background: var(--panel); color: var(--muted); }
  pre.prompt { white-space: pre-wrap; background: #fbfaf7; border-radius: 8px; padding: 10px; margin: 8px 0; font: 13.5px/1.5 system-ui, sans-serif; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  button {
    font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line);
    background: #fff; color: var(--text); cursor: pointer;
  }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.on { background: var(--text); color: #fff; border-color: var(--text); }
  button:disabled { opacity: .45; cursor: default; }
  footer { border-top: 1px solid var(--line); background: var(--bg); padding: 14px 24px 18px; }
  .composer { max-width: 880px; margin: 0 auto; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row select { width: auto; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
  .chip { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 2px 4px 2px 10px; font: 12.5px ui-monospace, Consolas, monospace; }
  .chip button { border: 0; background: none; padding: 0 6px; font-size: 14px; }
  textarea {
    width: 100%; min-height: 64px; max-height: 240px; resize: vertical; font: inherit;
    padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: #fff; margin-top: 8px;
  }
  .send { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; gap: 8px; flex-wrap: wrap; }
  .hint { color: var(--muted); font-size: 12.5px; }
  .pre { white-space: pre-wrap; }
  .plan-link.on { font-weight: 600; border-color: var(--accent); }
  .q { margin: 6px 0 0; }
  .score { font-size: 28px; font-weight: 600; line-height: 1.1; }
  .sev { font-size: 11px; padding: 1px 7px; border-radius: 9px; margin-right: 6px; }
  .sev.high { background: var(--del); color: var(--del-text); }
  .sev.medium { background: #fbf1dc; color: var(--warn); }
  .sev.low { background: var(--panel); color: var(--muted); }
  .finding { border-top: 1px solid var(--line); padding: 8px 0; }
  .finding:first-of-type { border-top: 0; }
  table.risk { border-collapse: collapse; width: 100%; font-size: 13px; margin-top: 8px; }
  table.risk td, table.risk th { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
  .spark { display: flex; gap: 2px; align-items: flex-end; height: 28px; margin-top: 6px; }
  @media (max-width: 760px) {
    body { display: block; height: auto; }
    aside { border-right: 0; border-bottom: 1px solid var(--line); }
    aside .files { max-height: 90px; }
    main { min-height: 100vh; }
    #log { padding: 14px; }
    footer { padding: 12px 14px; }
    .user { max-width: 90%; }
    .row select { max-width: 100%; }
  }
  .plan-chat { display: flex; gap: 8px; margin-top: 10px; }
  .spark div { flex: 1; background: var(--accent); opacity: .55; border-radius: 2px 2px 0 0; }
</style>
</head>
<body>
<aside>
  <div>
    <h2>Proje</h2>
    <select id="project"></select>
    <div class="muted" id="sub" style="margin-top:6px"></div>
  </div>
  <div>
    <h2>Haftalık bütçe</h2>
    <div class="bar"><div id="budget-bar"></div></div>
    <div class="muted" id="budget-text"></div>
  </div>
  <div>
    <h2>Maliyet (son 7 gün)</h2>
    <div id="costs" class="muted"></div>
  </div>
  <div>
    <h2>Sağlık (RepoDoctor)</h2>
    <div class="score" id="health-score">–</div>
    <div class="muted" id="health-sub">Henüz tarama yok.</div>
    <div class="spark" id="health-trend"></div>
    <div class="btns">
      <button id="scan-btn">Tara</button>
      <button id="findings-btn">Bulgular</button>
    </div>
  </div>
  <div>
    <h2>PR riski (ReleaseGuard)</h2>
    <input type="text" id="risk-base" placeholder="Temel dal (boş: main)">
    <div class="btns"><button id="risk-btn">Riski hesapla</button></div>
  </div>
  <div>
    <h2>Sohbetler</h2>
    <button id="new-session" class="plan-link">+ Yeni sohbet</button>
    <div id="sessions"></div>
  </div>
  <div>
    <h2>Planlar</h2>
    <div id="plans"></div>
  </div>
  <div>
    <h2>Proje dosyaları</h2>
    <div class="files" id="files"></div>
  </div>
  <div class="btns" style="margin-top:0">
    <button id="undo">Son değişikliği geri al</button>
  </div>
</aside>

<main>
  <div id="log"></div>
  <footer>
    <div class="composer">
      <div class="row">
        <button id="mode-chat" class="on">Sohbet</button>
        <button id="mode-change">Değişiklik iste</button>
        <button id="mode-plan">Planla</button>
        <select id="intent" title="Sohbet modunda ne yapılsın">
          <option value="auto">Otomatik</option>
          <option value="change">Değişiklik</option>
          <option value="refine">Düzelt</option>
          <option value="explain">Açıkla</option>
          <option value="plan">Plan</option>
        </select>
        <span class="hint">Model:</span>
        <select id="model"></select>
        <label class="hint"><input type="checkbox" id="sbs"> yan yana diff</label>
        <button id="mic">Sesle yaz</button>
        <label class="hint"><input type="checkbox" id="speak"> yanıtı sesli oku</label>
      </div>
      <div class="row" style="margin-top:8px">
        <input type="text" id="pick" list="file-list" placeholder="Dosya ekle (boşsa seçici otomatik seçer)">
        <datalist id="file-list"></datalist>
      </div>
      <div class="hint warn" id="pick-hint"></div>
      <div class="chips" id="chips"></div>
      <textarea id="input" placeholder="Ne değişsin? Örn: login fonksiyonuna şifre uzunluk kontrolü ekle"></textarea>
      <div class="send">
        <span class="hint" id="estimate">Enter gönderir, Shift+Enter yeni satır</span>
        <div class="row">
          <button id="estimate-btn">Tahmin et</button>
          <button class="primary" id="send">Gönder</button>
        </div>
      </div>
    </div>
  </footer>
</main>

<script>
const $ = (id) => document.getElementById(id);
const log = $("log");
const TOKEN = (() => {
  const q = new URLSearchParams(location.search).get("token");
  if (q) sessionStorage.setItem("tw-token", q);
  return q || sessionStorage.getItem("tw-token") || "";
})();
let pid = null;
let project = null;
let mode = "chat";
let busy = false;
let picked = [];
let sid = null;
let speakReplies = false;
let pendingFinding = null;

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}

function button(label, onClick, primary = false) {
  const b = el("button", primary ? "primary" : "", label);
  b.onclick = onClick;
  return b;
}

async function api(path, body, method) {
  const opts = { method: method || (body === undefined ? "GET" : "POST"), headers: { "X-Tokenwise-Token": TOKEN } };
  if (body !== undefined) {
    opts.headers["Content-Type"] = "application/json";
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(typeof data.detail === "string" ? data.detail : res.statusText);
  return data;
}

const P = (suffix) => `/api/projects/${encodeURIComponent(pid)}${suffix}`;
const modelValue = () => $("model").value;

function addUser(text) {
  log.appendChild(el("div", "user", text));
  log.scrollTop = log.scrollHeight;
}

function addAssistant() {
  const box = el("div", "assistant msg");
  log.appendChild(box);
  log.scrollTop = log.scrollHeight;
  return box;
}

function unifiedView(diff) {
  const pre = el("pre", "diff");
  for (const line of diff.split("\n")) {
    const isAdd = line.startsWith("+") && !line.startsWith("+++");
    const isDel = line.startsWith("-") && !line.startsWith("---");
    const cls = isAdd ? "add" : isDel ? "del" : line.startsWith("@@") ? "hunk" : "";
    pre.appendChild(el("div", cls, line));
  }
  return pre;
}

function sideBySideView(diff) {
  const wrap = el("div", "sbs");
  const cell = (text, cls) => el("div", "cell " + cls, text);
  let removed = [];
  let added = [];
  const flush = () => {
    const n = Math.max(removed.length, added.length);
    for (let i = 0; i < n; i++) {
      wrap.appendChild(removed[i] !== undefined ? cell(removed[i], "del") : cell("", "empty"));
      wrap.appendChild(added[i] !== undefined ? cell(added[i], "add") : cell("", "empty"));
    }
    removed = [];
    added = [];
  };
  for (const line of diff.split("\n")) {
    if (line.startsWith("---") || line.startsWith("+++") || line.startsWith("@@") || line.startsWith("\\")) continue;
    if (line.startsWith("-")) removed.push(line.slice(1));
    else if (line.startsWith("+")) added.push(line.slice(1));
    else {
      flush();
      wrap.appendChild(cell(line.slice(1), ""));
      wrap.appendChild(cell(line.slice(1), ""));
    }
  }
  flush();
  return wrap;
}

function diffView(diff) {
  const holder = el("div", "diff-holder");
  holder.dataset.diff = diff;
  holder.appendChild($("sbs").checked ? sideBySideView(diff) : unifiedView(diff));
  return holder;
}

function rerenderDiffs() {
  for (const holder of document.querySelectorAll(".diff-holder")) {
    holder.replaceChildren($("sbs").checked ? sideBySideView(holder.dataset.diff) : unifiedView(holder.dataset.diff));
  }
}

// Shows a proposal. Returns { decided }: a promise that resolves to "applied", "skipped" or "failed".
function resultView(res) {
  const box = addAssistant();
  let settle;
  const decided = new Promise((resolve) => (settle = resolve));
  const tokens = res.usage.input + res.usage.output;
  box.appendChild(el("div", "muted",
    `${res.difficulty || "-"} · ${res.model || "-"} · ${res.files.length} dosya · ` +
    `${tokens.toLocaleString("tr-TR")} token · $${res.cost_usd.toFixed(4)}`));
  if (res.error) box.appendChild(el("div", "err", res.error));
  if (res.check && res.check.command) {
    const state = res.check.passed ? ["ok", "Kontrol geçti"] :
      res.check.passed === false ? ["err", "Kontrol geçmedi"] : ["warn", "Kontrol yapılmadı"];
    box.appendChild(el("div", state[0], state[1]));
    if (res.check.output) {
      const details = el("details");
      details.appendChild(el("summary", "muted", "Kontrol çıktısı"));
      details.appendChild(el("pre", "", res.check.output));
      box.appendChild(details);
    }
  }
  if (!res.ok || !res.changes.length) {
    settle("failed");
    return { decided };
  }
  if (res.pending === false) {  // reopened session: applied, replaced, or the server restarted
    for (const c of res.changes) {
      box.appendChild(el("div", "file", `${c.path}  (+${c.added} −${c.removed})`));
      box.appendChild(diffView(c.diff));
    }
    box.appendChild(el("div", "muted", "Bu öneri artık uygulanamaz (uygulandı, yenisiyle değişti ya da sunucu yeniden başladı). Gerekirse isteği yeniden gönder."));
    settle("failed");
    return { decided };
  }
  for (const c of res.changes) {
    box.appendChild(el("div", "file", `${c.path}  (+${c.added} −${c.removed})`));
    box.appendChild(diffView(c.diff));
  }
  const row = el("div", "btns");
  const apply = button("Uygula", async () => {
    try {
      const applied = await api(P("/apply"), { run_id: res.run_id });
      apply.disabled = skip.disabled = true;
      box.appendChild(el("div", "ok", "Uygulandı."));
      if (applied.check) {
        const c = applied.check;
        box.appendChild(el("div", c.passed ? "ok" : "err",
          c.passed ? "Proje kontrolü geçti." : "Proje kontrolü geçmedi."));
        if (c.passed === false) {
          const undo = button("Geri al", async () => {
            try {
              await api(P("/undo"), {});
              box.appendChild(el("div", "ok", "Geri alındı."));
              refresh();
            } catch (e) {
              box.appendChild(el("div", "err", e.message));
            }
          });
          const fix = button("Hatayla düzelt", () => {
            $("input").value = `Uygulanan değişiklik proje kontrolünde şu hatayla geçmedi:\n${(c.output || "").slice(-1500)}\nBunu düzelt.`;
            setChat("refine");
          });
          row.append(undo, fix);
        }
      }
      if (project && project.git) {
        const commitBtn = button("Commit'le", async () => {
          try {
            const c = await api(P("/commit"), { run_id: res.run_id });
            commitBtn.disabled = true;
            box.appendChild(el("div", "ok", `Commit: ${c.commit} — ${c.message}`));
          } catch (e) {
            box.appendChild(el("div", "err", e.message));
          }
        });
        row.appendChild(commitBtn);
      }
      settle("applied");
      refresh();
      if (pendingFinding) verifyFinding(pendingFinding, box);
    } catch (e) {
      box.appendChild(el("div", "err", e.message));
    }
  }, true);
  const skip = button("Vazgeç", () => {
    apply.disabled = skip.disabled = true;
    settle("skipped");
  });
  const fine = button("Düzelt", () => setChat("refine"));
  const look = button("İncele", () => review(res.run_id, box));
  row.append(apply, skip, fine, look);
  box.appendChild(row);
  return { decided };
}

function renderPlan(plan) {
  const box = addAssistant();
  box.classList.add("plan");
  const head = el("div", "plan-head");
  head.appendChild(el("h3", "", plan.goal));
  const runAllBtn = button("Planı sırayla çalıştır", () => runAll(plan, runAllBtn), true);
  head.append(runAllBtn, button("Markdown indir", () => downloadExport(plan)));
  box.appendChild(head);
  box.appendChild(el("div", "muted", `${plan.threads.length} iş parçacığı · ${plan.model} · $${plan.cost_usd.toFixed(4)}`));
  plan.cards = [];
  for (const t of plan.threads) {
    const card = el("div", "thread");
    const headRow = el("div", "thread-head");
    headRow.append(el("span", "num", String(t.index + 1)), el("strong", "", t.title), el("span", "badge", t.level));
    card.appendChild(headRow);
    if (t.depends_on.length) card.appendChild(el("div", "muted", "Önce bitmesi gerekenler: " + t.depends_on.map((i) => i + 1).join(", ")));
    if (t.files.length) card.appendChild(el("div", "muted", "Dosyalar: " + t.files.join(", ")));
    card.appendChild(el("pre", "prompt", t.prompt));
    if (t.check) card.appendChild(el("div", "muted", "Kontrol: " + t.check));
    const row = el("div", "btns");
    const copy = button("Prompt'u kopyala", async () => {
      try {
        await navigator.clipboard.writeText(t.prompt);
        copy.textContent = "Kopyalandı ✓";
      } catch {
        copy.textContent = "Kopyalanamadı";
      }
      setTimeout(() => (copy.textContent = "Prompt'u kopyala"), 1500);
    });
    const run = button("Bu iş parçacığını çalıştır", () => runThread(plan, t), true);
    const skip = button("Atla", () => setStatus(plan, t, "skipped"));
    const done = button("Bitti say", () => setStatus(plan, t, "done"));
    const reopen = button("Geri aç", () => setStatus(plan, t, "pending"));
    const badge = el("span", "badge", "");
    headRow.appendChild(badge);
    row.append(copy, run, skip, done, reopen);
    card.appendChild(row);
    box.appendChild(card);
    plan.cards.push({ t, card, run, skip, done, reopen, badge });
  }
  const talk = el("div", "plan-chat");
  const input = el("input");
  input.type = "text";
  input.placeholder = "Planı değiştir. Örn: 2. adımı ikiye böl, testleri en sona al";
  const ask = button("Planı güncelle", async () => {
    const text = input.value.trim();
    if (!text || busy) return;
    busy = true;
    ask.disabled = true;
    const note = el("div", "muted", "Plan güncelleniyor…");
    box.appendChild(note);
    try {
      const updated = await api(P(`/plans/${plan.id}/chat`), { text, model: modelValue() });
      box.replaceWith(renderPlan(updated));
      refresh();
    } catch (e) {
      note.className = "err";
      note.textContent = e.message;
      ask.disabled = false;
    }
    busy = false;
  });
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") ask.click(); });
  talk.append(input, ask);
  box.appendChild(talk);
  refreshThreads(plan);
  return box;
}

function refreshThreads(plan) {
  const names = { pending: "", done: "bitti", skipped: "atlandı" };
  for (const { t, card, run, skip, done, reopen, badge } of plan.cards) {
    card.className = "thread " + t.status;
    const blocked = t.depends_on.some((i) => plan.threads[i].status !== "done");
    run.disabled = blocked || t.status !== "pending";
    run.title = blocked ? "Önce bağımlı iş parçacıkları bitmeli (ya da 'Bitti say')." : "";
    skip.style.display = done.style.display = t.status === "pending" ? "" : "none";
    reopen.style.display = t.status === "pending" ? "none" : "";
    badge.textContent = t.status in names ? names[t.status] : t.status;
    badge.style.display = badge.textContent ? "" : "none";
  }
}

async function setStatus(plan, t, status) {
  try {
    await api(P(`/plans/${plan.id}/threads/${t.index}`), { status }, "PUT");
  } catch (e) {
    addAssistant().appendChild(el("div", "err", e.message));
    return;
  }
  t.status = status;
  refreshThreads(plan);
  refresh();
}

// Runs one thread: asks, shows the proposal, waits for Uygula / Vazgeç. Returns the outcome.
async function runThread(plan, t) {
  if (busy) return "failed";
  busy = true;
  refreshThreads(plan);
  const note = addAssistant();
  note.appendChild(el("div", "muted", `Çalışıyor: ${t.title}…`));
  let outcome = "failed";
  try {
    const res = await api(P("/ask"), { request: t.prompt, model: modelValue(), check: t.check, files: t.files });
    note.remove();
    const view = resultView(res);
    outcome = await view.decided;
    if (outcome === "applied") await setStatus(plan, t, "done");
    if (outcome === "skipped") await setStatus(plan, t, "skipped");
  } catch (e) {
    note.textContent = "";
    note.appendChild(el("div", "err", e.message));
  }
  busy = false;
  refreshThreads(plan);
  return outcome;
}

async function runAll(plan, btn) {
  if (busy) return;
  btn.disabled = true;
  for (const t of plan.threads) {
    if (t.status !== "pending") continue;
    const blocked = t.depends_on.some((i) => plan.threads[i].status !== "done");
    if (blocked) {
      addAssistant().appendChild(el("div", "warn", `Durdu: "${t.title}" için önce bağımlı görevler bitmeli.`));
      break;
    }
    const outcome = await runThread(plan, t);
    if (outcome !== "applied") {
      addAssistant().appendChild(el("div", "warn", `Durdu: "${t.title}" ${outcome === "skipped" ? "atlandı" : "uygulanmadı"}.`));
      break;
    }
  }
  btn.disabled = false;
  refreshThreads(plan);
}

async function downloadExport(plan) {
  const res = await fetch(P(`/plans/${plan.id}/export`), { headers: { "X-Tokenwise-Token": TOKEN } });
  const url = URL.createObjectURL(await res.blob());
  const a = el("a");
  a.href = url;
  a.download = `${plan.id}.md`;
  a.click();
  URL.revokeObjectURL(url);
}

async function openPlan(id) {
  const plan = await api(P(`/plans/${id}`));
  log.appendChild(renderPlan(plan));
}

async function sendPlan(goal) {
  const note = addAssistant();
  note.appendChild(el("div", "muted", "Hedef iş parçacıklarına bölünüyor…"));
  try {
    const plan = await api(P("/plan"), { goal, model: modelValue() });
    note.remove();
    log.appendChild(renderPlan(plan));
    refresh();
  } catch (e) {
    note.textContent = "";
    note.appendChild(el("div", "err", e.message));
  }
}

function showError(note, e, retry) {
  note.textContent = "";
  note.appendChild(el("div", "err", e.message));
  if (retry && e.message.startsWith("Haftalık bütçe doldu")) {
    const again = button("Yine de çalıştır", async () => {
      again.disabled = true;
      if (busy) return;
      busy = true;
      await retry();
      busy = false;
    });
    const row = el("div", "btns");
    row.appendChild(again);
    note.appendChild(row);
  }
}

async function sendChange(request, overBudget = false) {
  const note = addAssistant();
  note.appendChild(el("div", "muted", "Düşünüyor…"));
  try {
    const res = await api(P("/ask"), { request, model: modelValue(), files: picked, over_budget: overBudget });
    note.remove();
    resultView(res);
  } catch (e) {
    showError(note, e, () => sendChange(request, true));
  }
}

async function send() {
  const text = $("input").value.trim();
  if (!text || busy) return;
  busy = true;
  $("send").disabled = true;
  $("input").value = "";
  if (mode === "chat") {
    await sendTurn(text);
  } else {
    addUser(text);
    if (mode === "plan") await sendPlan(text);
    else await sendChange(text);
  }
  busy = false;
  $("send").disabled = false;
  $("input").focus();
}

function speak(text) {
  if (!speakReplies || !("speechSynthesis" in window)) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "tr-TR";
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

function renderMessage(m) {
  if (m.role === "user") return addUser(m.content);
  if (m.kind === "proposal" && m.data && m.data.run_id) return resultView(m.data);
  const box = addAssistant();
  if (m.kind === "plan") {
    box.appendChild(el("div", "", m.content));
    box.appendChild(button("Planı aç", () => openPlan(m.plan_id)));
  } else if (m.kind === "question") {
    box.appendChild(el("div", "", m.content));
    for (const q of m.questions || []) box.appendChild(el("div", "muted q", "• " + q));
    speak(m.content);
  } else if (m.kind === "error") {
    box.appendChild(el("div", "err", m.content));
  } else {
    box.appendChild(el("div", "pre", m.content));
    speak(m.content);
  }
  return box;
}

async function loadSessions() {
  const list = await api(P("/sessions"));
  $("sessions").textContent = "";
  for (const s of list) {
    const b = button(`${s.title || s.id}  (${s.count})`, () => openSession(s.id));
    b.className = "plan-link" + (s.id === sid ? " on" : "");
    $("sessions").appendChild(b);
  }
  if (!list.length) $("sessions").appendChild(el("div", "muted", "Henüz sohbet yok."));
}

function rememberSession(id) {
  sid = id;
  if (id) localStorage.setItem("tw-session-" + pid, id);
  else localStorage.removeItem("tw-session-" + pid);
}

async function openSession(id) {
  const s = await api(P(`/sessions/${id}`));
  rememberSession(id);
  log.textContent = "";
  for (const m of s.messages) renderMessage(m);
  log.scrollTop = log.scrollHeight;
  loadSessions();
}

async function ensureSession(title) {
  if (sid) return sid;
  const s = await api(P("/sessions"), { title: title.slice(0, 40) });
  rememberSession(s.id);
  return sid;
}

async function sendTurn(text, overBudget = false, intent = null) {
  const note = addAssistant();
  note.appendChild(el("div", "muted", "Düşünüyor…"));
  intent = intent || $("intent").value;
  try {
    await ensureSession(text);
    const turn = await api(P(`/sessions/${sid}/messages`), {
      text, intent, model: modelValue(), files: picked, over_budget: overBudget,
    });
    note.remove();
    for (const m of turn.messages) renderMessage(m);
    $("intent").value = "auto";
    loadSessions();
    refresh();
  } catch (e) {
    showError(note, e, () => sendTurn(text, true, intent));
  }
}

async function review(runId, box) {
  const note = el("div", "muted pre", "İnceleniyor…");
  box.appendChild(note);
  try {
    const r = await api(P(`/runs/${runId}/review`), {});
    note.className = "pre";
    note.textContent = r.review;
  } catch (e) {
    note.className = "err";
    note.textContent = e.message;
  }
}

async function loadHealth() {
  const h = await api(P("/health?limit=100"));
  const last = h.latest;
  $("health-score").textContent = last ? `${last.overall}/100` : "–";
  $("health-sub").textContent = last
    ? `${h.open ?? last.open_findings} açık bulgu · ${last.ts.slice(0, 10)}${last.commit_sha ? " · " + last.commit_sha : ""}`
    : "Henüz tarama yok.";
  $("health-trend").textContent = "";
  for (const t of h.trend) {
    const bar = el("div");
    bar.style.height = Math.max(2, (t.overall / 100) * 28) + "px";
    bar.title = `${t.ts.slice(0, 16)} · ${t.overall}`;
    $("health-trend").appendChild(bar);
  }
  return h;
}

async function runScan() {
  const box = addAssistant();
  box.appendChild(el("div", "muted", "Proje taranıyor…"));
  try {
    const r = await api(P("/health/scan"), {});
    box.textContent = "";
    box.appendChild(el("div", "", `Sağlık ${r.scores.overall}/100 · ${r.open} açık · ${r.new} yeni · ${r.resolved} çözüldü · ${r.files} dosya · ${r.seconds} sn`));
    const cats = Object.entries(r.scores).filter(([k]) => k !== "overall").map(([k, v]) => `${k} ${v}`).join(" · ");
    box.appendChild(el("div", "muted", cats));
    box.appendChild(button("Bulguları göster", showFindings));
    await loadHealth();
  } catch (e) {
    box.textContent = "";
    box.appendChild(el("div", "err", e.message));
  }
}

async function showFindings() {
  const h = await loadHealth();
  const box = addAssistant();
  if (!h.findings.length) {
    box.appendChild(el("div", "muted", h.latest ? "Açık bulgu yok." : "Önce Tara."));
    return;
  }
  box.appendChild(el("div", "", `Öncelik sırasına göre ${h.open ?? last.open_findings} açık bulgu (önem × dosyanın değişme ve bozulma sıklığı)`));
  for (const f of h.findings) {
    const row = el("div", "finding");
    const head = el("div");
    head.append(el("span", `sev ${f.severity}`, f.severity), el("span", "", `#${f.id} ${f.title}`));
    row.appendChild(head);
    const where = f.line ? `${f.file}:${f.line}` : f.file;
    const extra = [f.category, f.churn ? `${f.churn} commit` : "", f.fixes ? `${f.fixes} düzeltme` : ""].filter(Boolean).join(" · ");
    row.appendChild(el("div", "muted", `${where} · ${extra}`));
    const btns = el("div", "btns");
    btns.append(
      button("Agent ile düzelt", () => fixFinding(f.id), true),
      button("Yoksay", async (ev) => {
        await api(P(`/findings/${f.id}/status`), { status: "ignored" });
        row.remove();
        loadHealth();
      }),
    );
    row.appendChild(btns);
    box.appendChild(row);
  }
}

async function fixFinding(id) {
  const task = await api(P(`/findings/${id}/task`));
  pendingFinding = task.intent === "change" ? id : null;
  picked = task.files.filter((f) => project.files.includes(f));
  renderChips();
  $("input").value = task.request;
  setChat(task.intent);
  await send();
}

async function verifyFinding(id, box) {
  const note = el("div", "muted", `Bulgu #${id} doğrulanıyor (yeniden tarama)…`);
  box.appendChild(note);
  try {
    const r = await api(P(`/findings/${id}/verify`), {});
    note.className = r.resolved ? "ok" : "warn";
    note.textContent = r.resolved ? `Doğrulandı: bulgu #${id} artık görünmüyor.` : `Bulgu #${id} hâlâ görünüyor.`;
    pendingFinding = null;
    loadHealth();
  } catch (e) {
    note.className = "err";
    note.textContent = e.message;
  }
}

async function runRisk() {
  const box = addAssistant();
  box.appendChild(el("div", "muted", "Değişiklik analiz ediliyor…"));
  try {
    const r = await api(P("/risk"), { base: $("risk-base").value });
    box.textContent = "";
    const cls = r.level === "yüksek" ? "err" : r.level === "orta" ? "warn" : "ok";
    box.appendChild(el("div", cls, `Risk ${r.score}/100 (${r.level})`));
    box.appendChild(el("div", "muted", `temel ${r.base} · ${r.changed.length} kaynak dosya · +${r.lines_added} −${r.lines_removed} · ${r.commits} commit`));
    if (!r.changed.length) return;
    const table = el("table", "risk");
    const head = el("tr");
    for (const h of ["Sinyal", "Puan", "Güven", "Kanıt"]) head.appendChild(el("th", "", h));
    table.appendChild(head);
    for (const sig of r.signals) {
      const tr = el("tr");
      tr.append(el("td", "", sig.label), el("td", "", String(sig.points)), el("td", "", sig.confidence));
      const ev = el("td");
      for (const reason of sig.reasons) ev.appendChild(el("div", "", reason.replaceAll("`", "")));
      tr.appendChild(ev);
      table.appendChild(tr);
    }
    box.appendChild(table);
    if (r.checklist.length) {
      box.appendChild(el("div", "file", "Yayın öncesi kontrol listesi"));
      for (const item of r.checklist) box.appendChild(el("div", "", "☐ " + item.replaceAll("`", "")));
    }
    if (r.suggestions.length) {
      box.appendChild(el("div", "file", "Agent'ın üstlenebileceği işler"));
      const btns = el("div", "btns");
      for (const sug of r.suggestions) {
        btns.appendChild(button(sug.title, async () => {
          pendingFinding = null;
          picked = sug.files.filter((f) => project.files.includes(f));
          renderChips();
          $("input").value = sug.request;
          setChat("change");
          await send();
        }));
      }
      box.appendChild(btns);
    }
    const md = el("details");
    md.appendChild(el("summary", "muted", "PR yorumu için Markdown"));
    md.appendChild(el("pre", "", r.markdown));
    box.appendChild(md);
  } catch (e) {
    box.textContent = "";
    box.appendChild(el("div", "err", e.message));
  }
}

async function estimate() {
  try {
    const e = await api(P("/estimate"), { request: $("input").value, files: picked });
    $("estimate").textContent =
      `≈ ${e.input_tokens.toLocaleString("tr-TR")} giriş tokeni (harita ${e.map_tokens}, dosyalar ${e.files_tokens}) · ≈ $${e.est_usd.toFixed(4)} (kaba)`;
  } catch (e) {
    $("estimate").textContent = e.message;
  }
}

function pickHint(text) {
  $("pick-hint").textContent = text;
}

function renderChips() {
  $("chips").textContent = "";
  for (const f of picked) {
    const chip = el("span", "chip", f);
    const x = button("×", () => { picked = picked.filter((p) => p !== f); renderChips(); });
    x.style.padding = "0 6px";
    chip.appendChild(x);
    $("chips").appendChild(chip);
  }
}

$("pick").addEventListener("change", () => {
  const f = $("pick").value.trim();
  $("pick").value = "";
  if (!f) return;
  if (!project.files.includes(f)) return pickHint(`"${f}" projede yok. Listeden bir dosya seç.`);
  if (picked.includes(f)) return pickHint(`${f} zaten ekli.`);
  if (picked.length >= 8) return pickHint("En fazla 8 dosya eklenebilir.");
  picked.push(f);
  renderChips();
  pickHint("");
});

function setMode(next) {
  mode = next;
  $("mode-chat").classList.toggle("on", next === "chat");
  $("mode-change").classList.toggle("on", next === "change");
  $("mode-plan").classList.toggle("on", next === "plan");
  $("intent").style.display = next === "chat" ? "" : "none";
  $("input").placeholder = next === "plan"
    ? "Hedefi yaz. Örn: kayıt ekranına e-posta doğrulaması ekle"
    : next === "chat"
      ? "Ne istiyorsun? Değişiklik, açıklama, plan ya da düzeltme yazabilirsin"
      : "Ne değişsin? Örn: login fonksiyonuna şifre uzunluk kontrolü ekle";
}

function setChat(intent) {
  setMode("chat");
  $("intent").value = intent;
  $("input").focus();
}

async function loadProject(id) {
  pid = id;
  localStorage.setItem("tw-project", id);
  picked = [];
  sid = null;
  log.textContent = "";
  renderChips();
  project = await api(P(""));
  $("sub").textContent = `${project.files.length} dosya · harita ≈ ${project.map_tokens.toLocaleString("tr-TR")} token${project.git ? " · git" : ""}`;
  $("files").textContent = project.files.join("\n");
  $("file-list").textContent = "";
  for (const f of project.files) {
    const o = el("option");
    o.value = f;
    $("file-list").appendChild(o);
  }
  $("model").textContent = "";
  for (const m of ["", ...project.models]) {
    const o = el("option", "", m || "Otomatik (merdiven)");
    o.value = m;
    $("model").appendChild(o);
  }
  await loadSessions();
  await refresh();
  loadHealth().catch(() => {});
  const lastSession = localStorage.getItem("tw-session-" + id);
  if (lastSession) openSession(lastSession).catch(() => rememberSession(null));
}

async function refresh() {
  if (!pid) return;
  const current = await api(P(""));
  project = current;
  const { spent_usd: spent, limit_usd: limit } = current.budget;
  $("budget-bar").style.width = limit ? Math.min(100, (spent / limit) * 100) + "%" : "0%";
  $("budget-text").textContent = limit
    ? `$${spent.toFixed(4)} / $${limit.toFixed(2)} (son 7 gün)${spent >= limit ? " · doldu" : ""}`
    : `$${spent.toFixed(4)} (son 7 gün, limit yok)`;
  $("budget-text").className = limit && spent >= limit ? "err" : "muted";
  const costs = await api(P("/costs"));
  $("costs").textContent = "";
  const names = { tokenwise: "Değişiklik", plan: "Plan", chat: "Sohbet" };
  for (const [method, usd] of Object.entries(costs.by_method)) {
    $("costs").appendChild(el("div", "", `${names[method] || method}: $${usd.toFixed(4)}`));
  }
  if (!costs.runs) {
    $("costs").appendChild(el("div", "", "Bu dönemde harcama yok."));
  } else {
    const peak = Math.max(...costs.by_day.map((d) => d.cost_usd)) || 1;
    for (const d of costs.by_day) {
      const bar = el("div", "bar");
      const fill = el("div");
      fill.style.width = (d.cost_usd / peak) * 100 + "%";
      bar.appendChild(fill);
      $("costs").append(el("div", "", `${d.day.slice(5)}  $${d.cost_usd.toFixed(4)}`), bar);
    }
  }
  const plans = await api(P("/plans"));
  $("plans").textContent = "";
  for (const p of plans) {
    const b = button(`${p.goal.slice(0, 40)}  ${p.done}/${p.total}`, () => openPlan(p.id));
    b.className = "plan-link";
    $("plans").appendChild(b);
  }
  if (!plans.length) $("plans").appendChild(el("div", "muted", "Henüz plan yok."));
}

async function loadProjects() {
  const list = await api("/api/projects");
  $("project").textContent = "";
  for (const p of list) {
    const o = el("option", "", p.name);
    o.value = p.id;
    $("project").appendChild(o);
  }
  const saved = localStorage.getItem("tw-project");
  const first = list.find((p) => p.id === saved) || list[0];
  if (!first) {
    $("sub").textContent = "Bu sunucuda proje yok. tokenwise serve --root <klasör> ile başlat.";
    return;
  }
  $("project").value = first.id;
  await loadProject(first.id);
}

$("project").onchange = () => loadProject($("project").value);
$("undo").onclick = async () => {
  try {
    const r = await api(P("/undo"), {});
    addAssistant().appendChild(el("div", "ok", "Geri alındı: " + r.undone.join(", ")));
    refresh();
  } catch (e) {
    addAssistant().appendChild(el("div", "err", e.message));
  }
};
$("send").onclick = send;
$("estimate-btn").onclick = estimate;
$("scan-btn").onclick = runScan;
$("findings-btn").onclick = showFindings;
$("risk-btn").onclick = runRisk;
$("mode-chat").onclick = () => setMode("chat");
$("mode-change").onclick = () => setMode("change");
$("new-session").onclick = () => { rememberSession(null); log.textContent = ""; loadSessions(); };
$("speak").onchange = () => { speakReplies = $("speak").checked; };
const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
if (Rec) {
  $("mic").onclick = () => {
    const r = new Rec();
    r.lang = "tr-TR";
    r.interimResults = false;
    r.onresult = (e) => {
      const said = e.results[0][0].transcript;
      $("input").value = ($("input").value ? $("input").value + " " : "") + said;
    };
    r.start();
  };
} else {
  $("mic").disabled = true;
  $("mic").title = "Bu tarayıcı ses girişini desteklemiyor";
}
$("mode-plan").onclick = () => setMode("plan");
$("sbs").onchange = () => { localStorage.setItem("tw-sbs", $("sbs").checked ? "1" : ""); rerenderDiffs(); };
$("sbs").checked = localStorage.getItem("tw-sbs") === "1";
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
setMode("chat");
loadProjects().catch((e) => {
  $("sub").textContent = e.message === "Erişim anahtarı gerekli."
    ? "Erişim anahtarı gerekli. Sayfayı terminalde yazan adresle (sonunda ?token=… olan) aç."
    : e.message;
});
</script>
