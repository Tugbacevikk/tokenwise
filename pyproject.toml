[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tokenwise-coder"
version = "1.0.0"
description = "A frugal AI coding assistant: sends less context, writes less code."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Tuğba Çevik" }]
keywords = ["llm", "claude", "anthropic", "ollama", "cli", "token", "cost", "code-generation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "anthropic>=0.40",
    "typer>=0.12",
    "rich>=13",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
tokenwise = "tokenwise.cli:app"

[project.urls]
Repository = "https://github.com/Tugbacevikk/tokenwise"
Issues = "https://github.com/Tugbacevikk/tokenwise/issues"
Changelog = "https://github.com/Tugbacevikk/tokenwise/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["tokenwise"]

[tool.hatch.build.targets.sdist]
include = ["tokenwise", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests"]
