[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tokenwise-coder"
version = "1.0.0"
description = "A frugal AI coding assistant: sends less context, writes less code."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Tuğba Çevik" }]
keywords = ["llm", "claude", "anthropic", "ollama", "cli", "token", "cost", "code-generation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "anthropic>=0.40",
    "typer>=0.12",
    "rich>=13",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29"]
server = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "psycopg[binary]>=3.1",
    "pyjwt[crypto]>=2.8",
    "cryptography>=42",
    "ruff>=0.6",
    "bandit>=1.7",
    "tree-sitter>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-java>=0.23",
]
impact = [
    "tree-sitter>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-java>=0.23",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
    "bandit>=1.7",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "psycopg[binary]>=3.1",
    "pyjwt[crypto]>=2.8",
    "cryptography>=42",
    "httpx>=0.27",
    "tree-sitter>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-java>=0.23",
]

[project.scripts]
tokenwise = "tokenwise.cli:app"

[project.urls]
Repository = "https://github.com/Tugbacevikk/tokenwise"
Issues = "https://github.com/Tugbacevikk/tokenwise/issues"
Changelog = "https://github.com/Tugbacevikk/tokenwise/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["tokenwise"]

[tool.hatch.build.targets.sdist]
include = ["tokenwise", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.mypy]
python_version = "3.11"
files = ["tokenwise"]
ignore_missing_imports = true  # tree-sitter grammars and a few others ship no types
warn_unused_ignores = true
warn_redundant_casts = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument", "fastapi.Depends"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"benchmark/*/checks/*" = ["E401", "E402", "E501", "I001"]
"benchmark/*/*.py" = ["E501"]
