name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: The command you ran and what you saw. `tokenwise ... --json` output helps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: tokenwise version
      description: Output of `tokenwise --version`
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Model provider
      options: [Claude API, Ollama, LM Studio, Other OpenAI-compatible server]
  - type: input
    id: os
    attributes:
      label: Operating system and Python version
