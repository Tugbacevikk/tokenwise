name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"  # open() defaults to UTF-8 on every OS, not the Windows code page
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest --cov=tokenwise --cov-report=term-missing

  server:
    # The hosted version end to end: real PostgreSQL 16 and real Docker containers.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tokenwise_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      TOKENWISE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tokenwise_test
      TOKENWISE_DOCKER_IMAGE: python:3.12-slim
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: docker pull python:3.12-slim
      - run: pytest tests/test_server.py tests/test_phase2.py -v
      - run: docker build -t tokenwise-server .
      - run: docker run --rm tokenwise-server tokenwise server --help

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm ci
      - run: npm run compile
      - run: npx vsce package --no-dependencies
