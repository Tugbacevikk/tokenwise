name: reproduce measurements

# Re-runs docs/measurements.md on GitHub's machines from the pinned commits in
# benchmark/reproduce/repos.toml and fails when a number moves past the tolerance.
# Anyone can run it from the Actions tab (or in a fork) and download the raw outputs and the
# review sheets for human labelling. No model is called and no secret is needed.
on:
  workflow_dispatch:
  pull_request:  # when the measurement itself changes
    paths: ["benchmark/reproduce/**", "benchmark/labeling/**", ".github/workflows/reproduce.yml"]
  schedule:
    - cron: "17 4 1 * *"  # monthly, so tool updates that move the numbers get noticed

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # the analyzer versions the expected numbers were measured with
      - run: >-
          pip install -e ".[impact]" ruff==0.16.9 bandit==1.9.4
          tree-sitter==0.26.1 tree-sitter-javascript==0.25.0 tree-sitter-typescript==0.23.2
      - run: python benchmark/reproduce/run.py --jobs 4 --check
      - run: python benchmark/labeling/make_sheets.py .reproduce/results .reproduce/sheets
        if: always()
      - run: cat .reproduce/results/summary.md >> "$GITHUB_STEP_SUMMARY"
        if: always()
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: measurements
          path: |
            .reproduce/results
            .reproduce/sheets/*.csv
