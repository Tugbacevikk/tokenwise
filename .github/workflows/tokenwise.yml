# Tokenwise on its own repository (the same file as examples/github/tokenwise.yml, but
# installing Tokenwise from this checkout instead of PyPI).
# - Every pull request gets a ReleaseGuard risk report as a comment, edited on each push.
# - Every Monday, and on demand, RepoDoctor scans main; the health history is kept in the
#   Actions cache and the weekly report goes to the run summary.
# No model is called and no API key is needed.
name: tokenwise

on:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  releaseguard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # history is part of the risk signal
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[impact]"
      - name: Risk report
        run: |
          tokenwise risk --base "origin/${{ github.base_ref }}" --format markdown > risk.md
          cat risk.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comment on the pull request
        # a pull request from a fork gets a read-only token: the report stays in the summary
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --body-file risk.md --edit-last \
            || gh pr comment "${{ github.event.pull_request.number }}" --body-file risk.md

  repodoctor:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[impact]" ruff bandit
      - uses: actions/cache@v4
        with:
          path: .tokenwise/health.db
          key: tokenwise-health-${{ github.run_id }}
          restore-keys: tokenwise-health-
      - run: tokenwise scan --tools ruff,bandit
      - run: tokenwise findings --report > health-report.md
      - run: cat health-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: health-report
          path: health-report.md
