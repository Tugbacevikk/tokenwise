# Hosted Tokenwise: PostgreSQL, the web app and one worker. Settings: .env.server
# (copy .env.server.example). Read docs/hosting.md first: the worker uses the host's Docker.

# Logs are kept on the host by Docker; without a limit they grow forever. These limits are the
# retention docs/privacy.md promises: at most 5 files of 10 MB per service.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    logging: *logging
    image: postgres:16
    environment:
      POSTGRES_USER: tokenwise
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: tokenwise
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tokenwise"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  web:
    logging: *logging
    build: .
    command: ["tokenwise", "server", "web"]
    env_file: .env.server
    environment:
      DATABASE_URL: postgresql://tokenwise:${POSTGRES_PASSWORD}@db:5432/tokenwise
    ports:
      - "127.0.0.1:8000:8000"  # put a TLS proxy (Caddy, nginx) in front
    volumes:
      - ./github-app.pem:/run/secrets/github-app.pem:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  worker:
    logging: *logging
    build: .
    command: ["tokenwise", "server", "worker"]
    env_file: .env.server
    environment:
      DATABASE_URL: postgresql://tokenwise:${POSTGRES_PASSWORD}@db:5432/tokenwise
      TOKENWISE_WORK_DIR: /var/lib/tokenwise/work
    # Check containers are started by the host's Docker, which mounts the copy by its host
    # path: the work folder must be the same path inside and outside this container.
    volumes:
      - ./github-app.pem:/run/secrets/github-app.pem:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/tokenwise/work:/var/lib/tokenwise/work
    group_add:
      - "${DOCKER_GID:?set DOCKER_GID to the gid of /var/run/docker.sock}"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  backup:
    logging: *logging
    # one verified pg_dump a day into ./backups, kept 14 days (deploy/backup.sh)
    image: postgres:16
    entrypoint: ["sh", "/deploy/backup.sh"]
    environment:
      DATABASE_URL: postgresql://tokenwise:${POSTGRES_PASSWORD}@db:5432/tokenwise
      BACKUP_KEEP_DAYS: "14"
    volumes:
      - ./deploy:/deploy:ro
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
